# Render.com blueprint — one-click deploy of NammaWork (web + free Postgres).
services:
  - type: web
    name: plumberlink
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "bash start_render.sh"
    envVars:
      - key: PLUMBERLINK_DEBUG
        value: "0"
      - key: PLUMBERLINK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: plumberlink-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
databases:
  - name: plumberlink-db
    plan: free
